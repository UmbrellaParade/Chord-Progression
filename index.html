<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Progression Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Chord Progression Trainer</h1>
      <div class="main-tabs">
        <button class="main-tab active" data-view="chords">🎵 コード進行</button>
        <button class="main-tab" data-view="scales">🎼 スケール</button>
      </div>
    </header>

    <!-- Shared: key + display toggle -->
    <section class="controls">
      <div class="control-group" id="presetGroup">
        <label id="presetLabel">コード進行</label>
        <div class="preset-buttons" id="presetButtons"></div>
      </div>

      <div class="control-group" id="scaleCategoryGroup" style="display:none">
        <label>カテゴリ</label>
        <div class="preset-buttons" id="scaleCategoryButtons"></div>
      </div>

      <div class="control-group" id="scaleSelectGroup" style="display:none">
        <label>スケール</label>
        <div class="preset-buttons" id="scaleButtons"></div>
      </div>

      <div class="control-group">
        <label>キー</label>
        <div class="key-row">
          <div class="key-buttons" id="keyButtons"></div>
          <button class="btn-random" id="randomKey">🎲 ランダム</button>
        </div>
      </div>

      <div class="control-group">
        <label>表示</label>
        <div class="toggle-buttons">
          <button class="toggle active" data-mode="guitar" id="modeGuitar">🎸 ギター</button>
          <button class="toggle" data-mode="piano" id="modePiano">🎹 ピアノ</button>
        </div>
      </div>
    </section>

    <!-- Chord Progression View -->
    <div id="chordsView">
      <section class="progression-display" id="progressionDisplay"></section>
      <section class="detail-panel" id="detailPanel">
        <p class="detail-hint">コードをクリックして詳細を表示</p>
      </section>
    </div>

    <!-- Scale View -->
    <div id="scalesView" style="display:none">
      <section class="scale-display" id="scaleDisplay"></section>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="chords.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
